name: Dynamic player clearance v4
on:
  push:
    branches: [codex/dynamic-player-clearance]
    paths: ['.github/workflows/dynamic-player-clearance-v4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dynamic-player-clearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured-clearance patch with complete DOM capability guards
        run: |
          python - <<'PY'
          import pathlib,textwrap
          source=pathlib.Path('.github/workflows/dynamic-player-clearance.yml').read_text()
          script=textwrap.dedent(source.split("          python - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          script=script.replace("    addEventListener('resize',scheduleClearance,{passive:true});", "    window.addEventListener?.('resize',scheduleClearance,{passive:true});")
          script=script.replace("try{visualViewport?.addEventListener?.('resize'", "try{window.visualViewport?.addEventListener?.('resize'")
          script=script.replace(";visualViewport?.addEventListener?.('scroll'", ";window.visualViewport?.addEventListener?.('scroll'")
          script=script.replace("    const rect=root.getBoundingClientRect(),vh=window.innerHeight||document.documentElement.clientHeight||0;\n    return Math.ceil(Math.max(0,vh-rect.top)+8);", "    if(typeof root.getBoundingClientRect!=='function')return 0;\n    const rect=root.getBoundingClientRect(),vh=Number(window.innerHeight||document.documentElement?.clientHeight||0);\n    if(!Number.isFinite(rect?.top)||!Number.isFinite(vh)||vh<=0)return 0;\n    return Math.ceil(Math.max(0,vh-rect.top)+8);")
          script=script.replace("baseRootPadding=parseFloat(getComputedStyle(html).paddingBottom)||0", "baseRootPadding=typeof window.getComputedStyle==='function'?(parseFloat(window.getComputedStyle(html).paddingBottom)||0):0")
          script=script.replace("html.style.setProperty('--cmd-universal-clearance',`${baseRootPadding+value}px`);html.classList.add('cmd-universal-clearance');", "html.style?.setProperty?.('--cmd-universal-clearance',`${baseRootPadding+value}px`);html.classList?.add?.('cmd-universal-clearance');")
          script=script.replace("html.classList.remove('cmd-universal-clearance');html.style.removeProperty('--cmd-universal-clearance');baseRootPadding=null", "html.classList?.remove?.('cmd-universal-clearance');html.style?.removeProperty?.('--cmd-universal-clearance');baseRootPadding=null")
          script=script.replace("html.classList.remove('cmd-universal-clearance');baseRootPadding=", "html.classList?.remove?.('cmd-universal-clearance');baseRootPadding=")
          script=script.replace("  function scheduleClearance(){if(clearanceRaf)return;clearanceRaf=requestAnimationFrame(applyClearance)}", "  function scheduleClearance(){if(clearanceRaf)return;const raf=window.requestAnimationFrame;if(typeof raf==='function')clearanceRaf=raf.call(window,applyClearance);else applyClearance()}")
          # Persistent-frame clearance runs only in a real browser, but keep it defensive for unit fixtures too.
          script=script.replace("html.classList.remove('cmd-persistent-clearance');", "html.classList?.remove?.('cmd-persistent-clearance');")
          script=script.replace("html.style.setProperty('--cmd-persistent-clearance',`${state.base+pixels}px`);html.classList.add('cmd-persistent-clearance')", "html.style?.setProperty?.('--cmd-persistent-clearance',`${state.base+pixels}px`);html.classList?.add?.('cmd-persistent-clearance')")
          script=script.replace("html.classList.remove('cmd-persistent-clearance');html.style.removeProperty('--cmd-persistent-clearance');", "html.classList?.remove?.('cmd-persistent-clearance');html.style?.removeProperty?.('--cmd-persistent-clearance');")
          exec(compile(script,'<dynamic-clearance-v4>','exec'))
          PY
      - name: Full static and playback regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/player-clearance-qa
          node --check universal-player.js
          node --check persistent-site-browser.js
          node --check scripts/check-player-clearance-browser.mjs
          node scripts/sync-releases.mjs --check
          node --test tests/playback-sync.test.js
          node --test tests/*.test.js tests/*.test.mjs | tee /tmp/player-clearance-qa/node-tests.txt
          git diff --check
      - name: Real mobile geometry and playback regressions
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/serve-release-test.mjs >/tmp/player-clearance-qa/server.log 2>&1 &
          sleep 2
          node scripts/check-table-for-two-browser.mjs
          node scripts/check-replay-return-browser.mjs
          node scripts/check-player-clearance-browser.mjs
      - name: Commit tested product files only
        run: |
          git add universal-player.js persistent-site-browser.js scripts/check-player-clearance-browser.mjs
          HTML_CHANGED=$(git diff --name-only -- '*.html' || true)
          if [ -n "$HTML_CHANGED" ]; then git add $HTML_CHANGED; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Measure fixed-player obstruction and keep page endings scrollable'
          git push origin HEAD:codex/dynamic-player-clearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-player-clearance-proof-v4
          path: |
            /tmp/player-clearance-qa/
            /tmp/table-for-two-qa/
            /tmp/replay-qa/
          retention-days: 7

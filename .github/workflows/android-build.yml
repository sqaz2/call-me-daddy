name: Android preview APK
on:
  push:
    branches: [main, feat/android-music-player]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Catalogue and queue regression tests
        run: node --test android/tests/*.test.cjs
      - name: Build and lint Android preview
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MusicSubject-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

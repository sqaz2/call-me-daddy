name: Prepare Everybody Else Less
on:
  push:
    branches: [content/everybody-else-less]
    paths:
      - '.github/workflows/prepare-everybody-else-less.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/content/everybody-else-less'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate just this legacy identity and regenerate its release records
        run: |
          node scripts/migrate-everybody-else-less.mjs
          node scripts/sync-releases.mjs --check
          node --test tests/everybody-else-less.test.mjs tests/playback-sync.test.js
          git diff --check
      - name: Commit generated records to the isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/songs.js data/song-lyrics.js data/briefing.js data/radio-intents.js sitemap.xml updates/release-everybody-else-less/index.html
          git diff --cached --quiet || git commit -m 'Synchronize Everybody Else Less without duplicating its legacy identity'
          git push origin HEAD:refs/heads/content/everybody-else-less
          git rev-parse HEAD
      - name: Collect reviewed generated files and original artwork
        run: |
          mkdir -p /tmp/everybody-prepared
          cp --parents data/songs.js data/song-lyrics.js data/briefing.js data/radio-intents.js sitemap.xml updates/release-everybody-else-less/index.html media/collections/sad-music/2026/everybody-else-less/cover.jpg /tmp/everybody-prepared/
          git log -2 --format=fuller > /tmp/everybody-prepared/commits.txt
          git diff HEAD~1 HEAD > /tmp/everybody-prepared/generated.diff
      - uses: actions/upload-artifact@v4
        with:
          name: everybody-prepared
          path: /tmp/everybody-prepared
          retention-days: 3
          if-no-files-found: error

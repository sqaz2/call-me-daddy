name: Prepare Everybody Else Less
on:
  push:
    branches: [content/everybody-else-less]
    paths: [.github/workflows/prepare-everybody-else-less.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect source text and original recording for isolated release work
        shell: bash
        run: |
          mkdir -p /tmp/everybody-source/repository /tmp/everybody-source/source
          python3 - <<'PY'
          import pathlib, shutil, subprocess, json, urllib.request, urllib.error
          out=pathlib.Path('/tmp/everybody-source')
          listing=subprocess.check_output(['git','ls-tree','-r','--long','HEAD'],text=True)
          (out/'source/tree.txt').write_text(listing)
          for row in listing.splitlines():
              meta,name=row.split('\t',1)
              src=pathlib.Path(name)
              if src.is_file() and (src.suffix.lower() in ['.md','.txt','.html','.css','.js','.mjs','.cjs','.json','.jsonc','.yml','.yaml','.svg','.toml'] or name=='Everybody Else Less.mp3'):
                  dest=out/'repository'/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(src,dest)
          url='https://suno.com/s/jOr9CSygvDsRHMC9'
          report={'requestedUrl':url}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as res:
                  report.update(status=res.status,finalUrl=res.url,contentType=res.headers.get('Content-Type'))
                  data=res.read(5000000)
                  (out/'source/suno.html').write_bytes(data)
                  report['bytes']=len(data)
          except Exception as e:
              report['error']=str(e)
          (out/'source/retrieval.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          ffprobe -v quiet -show_format -show_streams -print_format json 'Everybody Else Less.mp3' > /tmp/everybody-source/source/audio-probe.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: everybody-release-source
          path: /tmp/everybody-source
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

name: Replay diagnostics
on:
  push:
    branches: [codex/replay-after-browsing]
    paths: ['.github/workflows/replay-diagnostic.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle source and relevant original media for offline debugging
        run: |
          mkdir -p /tmp/replay-inputs
          python - <<'PY'
          import pathlib, zipfile, subprocess
          root=pathlib.Path('.')
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/replay-inputs/source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=root/name
                  if p.suffix.lower() in {'.js','.mjs','.html','.css','.json','.jsonc','.xml','.md','.txt','.yml','.yaml','.svg'} or name.startswith('media/songs/2026/09/set-a-table-for-two/'):
                      archive.write(p,name)
          pathlib.Path('/tmp/replay-inputs/paths.txt').write_text('\n'.join(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: replay-debug-inputs
          path: /tmp/replay-inputs/
          retention-days: 3

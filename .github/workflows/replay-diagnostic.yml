name: Replay diagnostics
on:
  push:
    branches: [codex/replay-after-browsing]
    paths: ['.github/workflows/replay-diagnostic.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare touch-enabled Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Reproduce returning to previously played cuts
        run: |
          mkdir -p /tmp/replay-qa
          node scripts/serve-release-test.mjs >/tmp/replay-qa/server.log 2>&1 &
          sleep 2
          node scripts/diagnose-replay.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-browser-diagnostics
          path: /tmp/replay-qa/
          retention-days: 3

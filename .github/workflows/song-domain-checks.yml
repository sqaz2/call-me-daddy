name: Song domain activation
on:
  push:
    branches: [main]
    paths:
      - wrangler.jsonc
      - worker/**
      - data/song-links.json
      - scripts/check-song-links-live.mjs
      - .github/workflows/song-domain-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify HTTPS and exact recording redirects after Cloudflare publishes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-song-links-live.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          echo "Domains are not ready. Inspect the existing call-me-daddy Cloudflare build and domain status."
          exit 1

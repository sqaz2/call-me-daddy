name: Table for two release build
on:
  push:
    branches: [codex/set-a-table-for-two]
    paths: ['.github/workflows/table-for-two-build.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/set-a-table-for-two
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified source patch
        run: |
          python - <<'PY'
          import pathlib, base64, lzma, hashlib, subprocess
          if pathlib.Path('set-a-table-for-two/index.html').exists():
              print('Release sources already present; preserving later fixes.')
          else:
              encoded = ''.join(pathlib.Path('scripts/table-release-part-%d.b64' % i).read_text().strip() for i in range(3))
              data = lzma.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == '87548c09949a47eb06afc85dda6a85a719983083a1e39039d1f88e6886266ec4', 'Source patch checksum mismatch'
              pathlib.Path('/tmp/table-release.patch').write_bytes(data)
              subprocess.run(['git','apply','--unidiff-zero','--check','/tmp/table-release.patch'],check=True)
              subprocess.run(['git','apply','--unidiff-zero','/tmp/table-release.patch'],check=True)
          PY
      - name: Synchronize complete release
        run: |
          node --check set-a-table-for-two/player.js
          node --check scripts/check-table-for-two-browser.mjs
          node scripts/sync-releases.mjs
          node scripts/sync-releases.mjs --check
          git diff --check
      - name: Test all release and site contracts
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Commit tested source and generated catalog together
        run: |
          git add content/releases/2026-09-07-set-a-table-for-two.json set-a-table-for-two/index.html set-a-table-for-two/release.css set-a-table-for-two/player.js set-a-table-for-two/lyrics.txt set-a-table-for-two/sources.json tests/table-for-two.test.js scripts/check-table-for-two-browser.mjs scripts/sync-releases.mjs RELEASE-WORKFLOW.md data/content-intensity.js index.html music/index.html updates/index.html data/songs.js data/song-lyrics.js data/briefing.js data/radio-intents.js sitemap.xml updates/release-set-a-table-for-two/index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Build Fuck Everybody But You / Set A Table For Two two-cut release'
            git push origin HEAD:codex/set-a-table-for-two
          fi
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exercise real decoding, controls and persistent navigation
        run: |
          mkdir -p /tmp/table-for-two-qa
          python -m http.server 8765 > /tmp/table-for-two-qa/http.log 2>&1 &
          sleep 2
          node scripts/check-table-for-two-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-for-two-browser-qa
          path: /tmp/table-for-two-qa/
          retention-days: 3

name: Table for two release preflight
on:
  push:
    branches: [codex/set-a-table-for-two]
    paths: ['.github/workflows/table-for-two-preflight.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect original media and collect public lyric sources
        run: |
          python -m pip install --quiet mutagen Pillow
          python - <<'PY'
          import json, pathlib, urllib.request, zipfile, hashlib
          from mutagen.mp3 import MP3
          from PIL import Image
          root = pathlib.Path('.')
          out = pathlib.Path('/tmp/table-for-two-audit')
          out.mkdir(exist_ok=True)
          media = root / 'media/songs/2026/09/set-a-table-for-two'
          report = {'files': [], 'sources': []}
          for p in sorted(media.iterdir()):
              entry = {'path': str(p), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
              if p.suffix == '.mp3':
                  song = MP3(p)
                  entry.update(duration=song.info.length, sampleRate=song.info.sample_rate, tags={k: str(v)[:24000] for k, v in (song.tags or {}).items() if not k.startswith('APIC')})
              else:
                  with Image.open(p) as im:
                      entry.update(width=im.width, height=im.height, format=im.format)
              report['files'].append(entry)
          for i, url in enumerate(['https://suno.com/s/5rmGMj77SrOLhBhn', 'https://suno.com/s/Nw7V08o2iizno9gu']):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      (out / ('suno-%d.html' % i)).write_bytes(data)
                      report['sources'].append({'url':url, 'resolved':response.url, 'status':response.status, 'bytes':len(data)})
              except Exception as exc:
                  report['sources'].append({'url':url, 'error':str(exc)})
          (out/'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          paths = [str(p) for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          (out/'repository-paths.json').write_text(json.dumps(paths))
          with zipfile.ZipFile(out/'source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.suffix.lower() in {'.js','.mjs','.cjs','.html','.css','.json','.jsonc','.xml','.md','.txt','.yml','.yaml','.toml','.svg'} or p.parent == media:
                      z.write(p, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: table-for-two-build-inputs
          path: /tmp/table-for-two-audit/
          retention-days: 3

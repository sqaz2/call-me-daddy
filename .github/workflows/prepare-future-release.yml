name: Prepare future release
on:
  push:
    branches: [release/keep-building-your-future]
    paths:
      - '.github/workflows/prepare-future-release.yml'
      - 'scripts/prepare-future-release.py'
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read uploaded recording and artwork
        run: |
          python -m pip install --quiet mutagen pillow
          python scripts/prepare-future-release.py
      - name: Generate release catalog and share links
        run: |
          node scripts/sync-releases.mjs
          node scripts/sync-releases.mjs --check
          node --check keep-building-your-future/visual.js
          node --test tests/playback-sync.test.js tests/release-workflow.test.mjs tests/song-links.test.mjs
      - name: Commit generated release files to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/releases/2026-10-11-keep-building-your-future.json content/sources/keep-building-your-future.json keep-building-your-future/index.html data/songs.js data/song-lyrics.js data/briefing.js data/radio-intents.js sitemap.xml content/song-links.json data/song-links.json worker/song-links-data.mjs share.js updates/
          git diff --cached --quiet || git commit -m "Generate future release metadata, lyrics, catalog and sharing"
          git push origin HEAD:release/keep-building-your-future

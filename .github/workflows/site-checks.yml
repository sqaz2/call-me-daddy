name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check scripts/sync-releases.mjs
          node --check scripts/audit-media.mjs
          node --check data/songs.js
          node --check data/briefing.js
          node --check data/radio-intents.js
          node --check data/2026-08-25-uploads.js
          node --check data/2026-08-26-uploads.js
          node --check data/2026-08-27-uploads.js
          node --check data/2026-08-29-uploads.js
          node --check data/artwork-fallback.js
          node --check data/anti-ai-collection.js
          node --check catalog-cycle.js
          node --check playlist-radio.js
          node --check continuous-playback.js
          node --check universal-player.js
          node --check persistent-site-browser.js
          node --check home-briefing.js
          node --check placeholder-art.js
          node --check music/music.js
          node --check swipe-nav.js
          node --check listener-taste.js
          node --check data/taste-clusters.js
          node --check data/content-intensity.js
          node --check catalog-search.js
          node --check data/song-lyrics.js
          node --check data/lineages.js
          node --check music/taste-rail.js
          node --check home-listening.js
          node --check music/lineages.js
          node --check music/now-playing-share.js
          node --check anti-generative-ai-diss/collection.js
          node --check concrete-under-evergreens/player.js
          node --check funhouse-meltdown/player.js
          node --check archive/2019-heartbreak-rehearsals/player.js
          node --check updates/updates.js
          node --check twas-the-tism-mlord/player.js
          node --check worker/index.mjs
      - name: Release manifest synchronization
        run: node scripts/sync-releases.mjs --check
      - name: Media size safety
        run: node --test tests/media-audit.test.mjs
      - name: Radio engine tests
        run: node --test tests/radio-cycle.test.js
      - name: August 29 upload tests
        run: node --test tests/aug29-uploads.test.js
      - name: Artwork fallback tests
        run: node --test tests/artwork-fallback.test.js
      - name: Swipe browse tests
        run: node --test tests/swipe-nav.test.js
      - name: Listener final tests
        run: node --test tests/listener-final.test.js
      - name: Taste cluster tests
        run: node --test tests/taste-clusters.test.js
      - name: Vibe guard / intensity tests
        run: node --test tests/vibe-guard.test.js
      - name: Lyric search tests
        run: node --test tests/lyric-search.test.js
      - name: Lyrics UI tests
        run: node --test tests/lyrics-ui.test.js
      - name: Four-track player handoff tests
        run: node --test tests/four-track-player.test.js
      - name: Concrete Under Evergreens player tests
        run: node --test tests/concrete-player.test.js
      - name: Playlist continuity tests
        run: node --test tests/playlist-continuity.test.js
      - name: Background playback recovery tests
        run: node --test tests/continuous-playback.test.js
      - name: Universal player tests
        run: node --test tests/universal-player.test.js
      - name: Public feed tests
        run: node --test tests/site-feed.test.js
      - name: Release workflow tests
        run: node --test tests/release-workflow.test.mjs
      - name: Streaming delivery tests
        run: node --test tests/media-stream.test.mjs

name: Verify table-two audio-only correction
on:
  push:
    branches: [codex/table-two-audio-swap]
    paths: ['.github/workflows/table-two-audio-swap.yml']
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/table-two-audio-swap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Swap audio assignments only; preserve artwork, links and copy
        run: |
          python - <<'PY'
          import copy, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          manifest_path = root/'content/releases/2026-09-07-set-a-table-for-two.json'
          manifest = json.loads(manifest_path.read_text())
          original = copy.deepcopy(manifest)
          main, clone = manifest['song']['variants']
          assert (main['id'], clone['id']) == ('main', 'voice-clone')
          assert main['audio'].endswith('/fuck everybody but you.mp3')
          assert clone['audio'].endswith('/Set A Table For Two.mp3')
          for key in ('audio', 'duration'):
              main[key], clone[key] = clone[key], main[key]
          manifest['song']['audio'] = main['audio']
          expected = copy.deepcopy(original)
          expected['song']['audio'] = main['audio']
          for before, after in zip(expected['song']['variants'], manifest['song']['variants']):
              before['audio'], before['duration'] = after['audio'], after['duration']
          assert manifest == expected, 'Only audio assignments and durations may change in the release record'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n')

          source_path = root/'set-a-table-for-two/sources.json'
          sources = json.loads(source_path.read_text())
          first, second = sources['recordings']
          for key in ('file', 'bytes', 'sha256', 'durationSeconds'):
              first[key], second[key] = second[key], first[key]
          sources['artworkPairing'] = 'Artist correction: keep the full portrait and its existing Suno link in the main/wedding position, keep the close-up and its existing Suno link in the voice-clone position, and swap only the local recordings. Main now uses Set A Table For Two.mp3; voice-clone uses fuck everybody but you.mp3. Original files unchanged.'
          for recording, variant in zip(sources['recordings'], manifest['song']['variants']):
              assert recording['file'] == variant['audio']
              assert recording['durationSeconds'] == variant['duration']
              assert recording['sunoUrl'] == variant['sunoUrl']
          source_path.write_text(json.dumps(sources, ensure_ascii=False, indent=2)+'\n')

          page_path = root/'set-a-table-for-two/index.html'
          before_html = page_path.read_text()
          a, b = 'fuck%20everybody%20but%20you.mp3', 'Set%20A%20Table%20For%20Two.mp3'
          assert before_html.count(a) == 2 and before_html.count(b) == 2
          html = before_html.replace(a, '__TABLE_AUDIO_SWAP__').replace(b, a).replace('__TABLE_AUDIO_SWAP__', b)
          assert re.findall(r'https://suno\.com/[^"\s<>]+', html) == re.findall(r'https://suno\.com/[^"\s<>]+', before_html)
          assert re.findall(r'<img\b[^>]*>', html) == re.findall(r'<img\b[^>]*>', before_html)
          page_path.write_text(html)
          # Fetch fresh catalog data on the principal entry points without changing presentation.
          for name in ['index.html', 'music/index.html', 'updates/index.html', 'now-playing/index.html', 'set-a-table-for-two/index.html']:
              p = root/name
              text = p.read_text()
              updated, count = re.subn(r'(?<=src=")/data/songs\.js(?:\?[^"<>]*)?', '/data/songs.js?v=20260908-table-audio-swap', text)
              assert count == 1, (name, count)
              p.write_text(updated)

          test_path = root/'tests/table-for-two.test.js'
          text = test_path.read_text()
          old = re.search(r"test\('artist-directed size and artwork pairing is not guessed from filenames',\(\)=>\{.*?\n\}\);", text, re.S)
          assert old
          replacement = """test('artist correction swaps recordings while keeping artwork and Suno links in place',()=>{
            assert.ok(main.audio.endsWith('/Set A Table For Two.mp3'));assert.ok(main.cover.endsWith('/grok_image_1788830947264.jpg'));
            assert.ok(clone.audio.endsWith('/fuck everybody but you.mp3'));assert.ok(clone.cover.endsWith('/Screenshot_20260907-194633.png'));
            assert.ok(fs.statSync(path.join(root,main.audio)).size<fs.statSync(path.join(root,clone.audio)).size);
            assert.equal(main.duration,144.12);assert.equal(clone.duration,143.88);assert.equal(song.audio,main.audio);
            assert.equal(main.sunoUrl,'https://suno.com/song/8d3d14bd-65fb-4b04-95ae-fc46ef1a039b');
            assert.equal(clone.sunoUrl,'https://suno.com/song/de2f1819-86af-48c8-8f2b-32e7cb559f9f');
          });"""
          text = text[:old.start()] + replacement + text[old.end():]
          text += """
          test('both corrected cuts keep their existing image and Suno button during playback',()=>{
            const e=environment();
            for(const [index,variant] of song.variants.entries()){
              e.buttons[index].click();
              assert.equal(e.media().src,variant.audio);
              assert.equal(e.ids.releaseCover.src,variant.cover);
              assert.equal(e.ids.releaseSuno.href,variant.sunoUrl);
              assert.equal(e.track().variantId,variant.id);
            }
          });
          test('generated catalog, no-JavaScript links and structured audio metadata use corrected sources',()=>{
            const window={};vm.runInNewContext(read('data/songs.js'),{window});
            const catalog=window.CMD_SONGS.find(item=>item.id===song.id);
            assert.equal(catalog.audio,main.audio);
            const html=read('set-a-table-for-two/index.html');
            const schema=JSON.parse(html.match(/<script type="application\\/ld\\+json">(.*?)<\\/script>/s)[1]);
            song.variants.forEach((variant,index)=>{
              assert.equal(catalog.variants[index].audio,variant.audio);
              assert.equal(catalog.variants[index].cover,variant.cover);
              assert.equal(catalog.variants[index].sunoUrl,variant.sunoUrl);
              assert.equal(decodeURI(new URL(schema.track[index].audio.contentUrl).pathname),variant.audio);
              assert.ok(html.includes(`href="${encodeURI(variant.audio)}">Play ${variant.label.toLowerCase()}</a>`));
            });
          });
          test('corrected provenance still maps both untouched recordings and artwork fingerprints',()=>{
            const sources=JSON.parse(read('set-a-table-for-two/sources.json'));
            for(const [index,recording] of sources.recordings.entries()){
              assert.equal(recording.file,song.variants[index].audio);
              assert.equal(recording.durationSeconds,song.variants[index].duration);
              assert.equal(recording.sunoUrl,song.variants[index].sunoUrl);
            }
            for(const item of sources.artwork){
              const data=fs.readFileSync(path.join(root,item.file));
              assert.equal(data.length,item.bytes);
              assert.equal(crypto.createHash('sha256').update(data).digest('hex'),item.sha256);
            }
          });
          """
          test_path.write_text(text)

          browser_path = root/'scripts/check-table-for-two-browser.mjs'
          text = browser_path.read_text()
          a, b = '/fuck everybody but you.mp3', '/Set A Table For Two.mp3'
          assert text.count(a) == 1 and text.count(b) == 1
          text = text.replace(a, '__TABLE_AUDIO_SWAP__').replace(b, a).replace('__TABLE_AUDIO_SWAP__', b)
          text = text.replace("assert.ok(playing.duration>143&&playing.duration<145);", "assert.ok(Math.abs(playing.duration-144.12)<.05);\n  assert.ok(playing.track.cover.endsWith('grok_image_1788830947264.jpg'));\n  assert.equal(playing.track.sunoUrl,'https://suno.com/song/8d3d14bd-65fb-4b04-95ae-fc46ef1a039b');")
          text = text.replace("let frame=await releaseFrame();", "let frame=await releaseFrame();\n  assert.equal(await frame.locator('#releaseSuno').getAttribute('href'),'https://suno.com/song/8d3d14bd-65fb-4b04-95ae-fc46ef1a039b');", 1)
          text = text.replace("assert.ok(playing.track.cover.endsWith('Screenshot_20260907-194633.png'));", "assert.ok(playing.track.cover.endsWith('Screenshot_20260907-194633.png'));\n  assert.ok(Math.abs(playing.duration-143.88)<.05);\n  assert.equal(playing.track.sunoUrl,'https://suno.com/song/de2f1819-86af-48c8-8f2b-32e7cb559f9f');")
          text = text.replace("check('Variant selection synchronizes real source, artwork and exact-cut share',playing);", "assert.equal(await frame.locator('#releaseSuno').getAttribute('href'),'https://suno.com/song/de2f1819-86af-48c8-8f2b-32e7cb559f9f');\n  check('Swapped audio keeps existing artwork, Suno links and exact-cut share',playing);")
          text = text.replace("check('Direct alternate link selects correct silent artwork and starts alternate on one tap');", "assert.ok(decodeURI(await deep.evaluate(()=>window.CMDUniversalPlayer.getMedia().src)).endsWith('/fuck everybody but you.mp3'));\n  check('Direct alternate link selects correct silent artwork and starts swapped alternate on one tap');")
          browser_path.write_text(text)
          print(json.dumps({'before':original['song']['variants'], 'after':manifest['song']['variants'], 'imagesAndSunoLinksUnchanged':True}, indent=2))
          PY
      - name: Synchronize and test the release and shared-player contracts
        run: |
          mkdir -p /tmp/table-for-two-qa
          node scripts/sync-releases.mjs
          node scripts/sync-releases.mjs --check
          node --check tests/table-for-two.test.js
          node --check scripts/check-table-for-two-browser.mjs
          node --test tests/playback-sync.test.js
          node --test tests/*.test.js tests/*.test.mjs | tee /tmp/table-for-two-qa/node-tests.txt
          git diff --check
          git diff > /tmp/table-for-two-qa/correction.patch
      - name: Prepare real browser tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exercise both swapped recordings through the production media Worker
        run: |
          node scripts/serve-release-test.mjs > /tmp/table-for-two-qa/http.log 2>&1 &
          sleep 2
          node scripts/check-table-for-two-browser.mjs
      - name: Commit only the tested correction and remove temporary workflow
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'content/releases/2026-09-07-set-a-table-for-two.json', 'set-a-table-for-two/sources.json', 'set-a-table-for-two/index.html', 'tests/table-for-two.test.js', 'scripts/check-table-for-two-browser.mjs', 'index.html', 'music/index.html', 'updates/index.html', 'now-playing/index.html', 'data/songs.js'}
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, 'Unexpected changes: '+str(changed-allowed)
          assert not any(name.startswith('media/') for name in changed)
          subprocess.run(['git','add',*sorted(changed)],check=True)
          PY
          git rm .github/workflows/table-two-audio-swap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Swap two release recordings; preserve artwork, Suno links and presentation'
          git push origin HEAD:codex/table-two-audio-swap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-two-audio-swap-qa
          path: /tmp/table-for-two-qa/
          retention-days: 7

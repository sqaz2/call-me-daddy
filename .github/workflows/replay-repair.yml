name: Commit verified replay repair
on:
  push:
    branches: [codex/replay-after-browsing]
    paths: ['.github/workflows/replay-repair.yml']
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/replay-after-browsing
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the already browser-verified source repair
        run: |
          python - <<'PY'
          import subprocess,textwrap
          workflow=subprocess.check_output(['git','show','d563202e6736da811a1abe48a67fb6fcb1dd8188:.github/workflows/replay-repair.yml'],text=True)
          script=textwrap.dedent(workflow.split("          python - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          # CI changes were applied separately through the authorized connector.
          script=script.split("p=Path('.github/workflows/site-checks.yml');s=p.read_text()",1)[0]
          # Keep the original two-space source formatting, with no semantic change.
          script='\n'.join(line for line in script.splitlines() if not (line.startswith('new=') and 'line[2:]' in line))
          exec(compile(script,'<verified-replay-repair>','exec'))
          PY
      - name: Recheck all code and unchanged media contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check set-a-table-for-two/player.js
          node --check scripts/check-replay-return-browser.mjs
          node scripts/sync-releases.mjs --check
          node --test tests/playback-sync.test.js
          node --test tests/*.test.js tests/*.test.mjs
          git diff --check
      - name: Commit source and remove temporary diagnostic workflows
        run: |
          python - <<'PY'
          import subprocess
          allowed={'set-a-table-for-two/player.js','set-a-table-for-two/index.html','tests/table-for-two.test.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['git','add',*sorted(changed)],check=True)
          PY
          git rm .github/workflows/replay-diagnostic.yml .github/workflows/replay-repair.yml scripts/diagnose-replay.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recover same-cut replay after its retained audio document is reloaded'
          git push origin HEAD:codex/replay-after-browsing

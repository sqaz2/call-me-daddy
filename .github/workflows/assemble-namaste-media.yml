name: Assemble Namaste Hamster media

on:
  push:
    paths:
      - '.upload-staging/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged media
        shell: bash
        run: |
          set -euo pipefail
          dest='media/songs/2026/08/namaste-hamster'
          mkdir -p "$dest"
          cat .upload-staging/cover.*.b64 | base64 --decode > "$dest/cover.jpg"
          cat .upload-staging/video.*.b64 | base64 --decode > "$dest/video.mp4"
          cat .upload-staging/audio.*.b64 | base64 --decode > "$dest/audio.opus"
          test -s "$dest/cover.jpg"
          test -s "$dest/video.mp4"
          test -s "$dest/audio.opus"
          rm -rf .upload-staging
      - name: Commit assembled media
        shell: bash
        run: |
          git config user.name 'Call Me Daddy site bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add Namaste Hamster web media'
          git push

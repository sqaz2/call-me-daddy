name: Wire newest-first radio
on:
  push:
    branches: [codex/what-changed-newest-radio]
    paths: ['.github/workflows/wire-latest-radio.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/what-changed-newest-radio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update only entry wiring, visit bootstrap and feed documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          visit='<script src="/visit-history.js?v=20260908-latest-1"></script>'
          for name in ['index.html','music/index.html','updates/index.html']:
              p=Path(name);s=p.read_text();assert 'visit-history.js' not in s
              p.write_text(s.replace('</head>',visit+'</head>'))
          p=Path('persistent-site-browser.js');s=p.read_text();marker="  const VERSION='20260906-2';";assert marker in s
          s=s.replace(marker,"  // Lightweight visit memory also covers direct arrivals on song pages.\n  if(!window.CMDVisitHistory&&document.createElement&&document.head?.appendChild){\n    const visit=document.createElement('script');visit.src='/visit-history.js?v=20260908-latest-1';\n    document.head.appendChild(visit);\n  }\n"+marker)
          p.write_text(s)
          p=Path('updates/index.html');s=p.read_text()
          a='<a class="btn primary" href="/music/?intent=surprise">Start the radio</a>'
          b='<button class="btn primary" id="latestRadioPlay" type="button" aria-describedby="latestRadioStatus" disabled>Play newest first</button>'
          assert s.count(a)==1;s=s.replace(a,b)
          a='<a class="btn" href="/">Back home</a></div></section>'
          b='<a class="btn" href="/">Back home</a></div><p id="latestRadioStatus" role="status">New releases first, then earlier music.</p><noscript><p>JavaScript is needed for this queue. The release links below still work.</p></noscript></section>'
          assert s.count(a)==1;s=s.replace(a,b)
          dependencies=[
              '/data/radio-intents.js?v=20260825-1&amp;release=20260907-table-two',
              '/data/content-intensity.js?v=20260905-vibe-guard&amp;release=20260907-table-two',
              '/listener-taste.js?v=20260905-taste-refine',
              '/catalog-cycle.js?v=20260905-vibe-guard',
              '/playlist-radio.js?v=20260827-1',
              '/persistent-site-browser.js?v=20260908-visit',
              '/universal-player.js?v=20260907-scrub',
              '/continuous-playback.js?v=20260827-1',
              '/latest-releases.js?v=20260908-latest-1',
              '/updates/latest-player.js?v=20260908-latest-1']
          s=s.replace('</body>',''.join(f'<script src="{name}"></script>' for name in dependencies)+'</body>');p.write_text(s)
          p=Path('BRIEFING.md');s=p.read_text()
          s+='\n\n## What Changed radio: newest first\n\nThe **Play newest first** button on `/updates/` starts a chronological release queue, not weighted surprise radio. `latest-releases.js` resolves playable new-release, new-version, archive-rework/find and interactive-release announcements against the current catalog; timestamps, not original recording years or homepage feature ranks, determine the order. Site-only updates and external-only media are not audio tracks. Original audio files, per-cut artwork and Suno links remain canonical. An announcement with `variantId` (or an exact `?version=` link) queues only that variant; without one, its playable variants keep their declared order. Recordings are deduplicated. Existing parked-version and heavy-lane preferences still apply.\n\n`visit-history.js` remembers only visit timestamps in local storage (`cmd:site-visit:v1`), shared across same-origin pages/tabs. A visit ends after 30 minutes without recorded activity. Its previous-visit boundary stays fixed through Homepage → Updates, reloads and playback navigation. First visits or unavailable storage get newest-first playback without claiming a previous visit. No-new-music visits still get the recent releases, never a silent button. Clearing browser storage resets the memory; no account or cross-device tracking is added. Day/month-only archive dates are not assigned invented release times and are only labelled new when their known date period follows the previous visit\'s period.\n\nThe button starts `CMDContinuousPlayback` synchronously from its click. It uses the existing universal dock and page-following rules, then hands the ordered prefix to the existing radio tail. Simply browsing Updates never starts audio or takes over a paused/playing session. New code tests and `scripts/check-latest-radio-browser.mjs` cover the visit boundary, chronological order, first-tap decoding, variant pairings, previous/next and continuous navigation.\n'
          p.write_text(s)
          PY
      - name: Validate all source and unchanged media contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check persistent-site-browser.js
          node --check visit-history.js
          node --check latest-releases.js
          node --check updates/latest-player.js
          node scripts/sync-releases.mjs --check
          node --test tests/playback-sync.test.js
          node --test tests/*.test.js tests/*.test.mjs
          git diff --check
      - name: Commit integrated sources and remove this temporary wiring workflow
        run: |
          python - <<'PY'
          import subprocess
          allowed={'index.html','music/index.html','updates/index.html','persistent-site-browser.js','BRIEFING.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['git','add',*sorted(changed)],check=True)
          PY
          git rm .github/workflows/wire-latest-radio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make What Changed radio play newest releases first with stable visit memory'
          git push origin HEAD:codex/what-changed-newest-radio

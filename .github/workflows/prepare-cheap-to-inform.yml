name: Prepare Cheap to Inform release
on:
  push:
    branches: [release/cheap-to-inform-20260911]
    paths:
      - 'cheap-to-inform/**'
      - 'content/releases/2026-09-11-cheap-to-inform.json'
      - '.github/workflows/prepare-cheap-to-inform.yml'
permissions:
  contents: write
concurrency:
  group: prepare-cheap-to-inform
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cheap-to-inform-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate catalog, feed, share page and sitemap together
        run: |
          node --check cheap-to-inform/player.js
          node scripts/sync-releases.mjs
          node scripts/sync-releases.mjs --check
      - name: Release and playback regressions
        run: |
          node --test cheap-to-inform/page.test.cjs
          node --test tests/playback-sync.test.js tests/continuous-playback.test.js tests/universal-player.test.js tests/release-workflow.test.mjs tests/site-feed.test.js
      - name: Verify original supplied media was preserved
        shell: bash
        run: |
          test "$(git hash-object media/songs/2026/09/cheap-to-inform/audio.mp3)" = 7251ce4298721a5e9586ee6f9ae1262faa03b1e0
          test "$(git hash-object media/songs/2026/09/cheap-to-inform/cover.jpg)" = b2acb75543208c3836faa626122586ab01d610eb
          test "$(git hash-object media/songs/2026/09/cheap-to-inform/background.mp4)" = da9fb3fd64859a029134c7eebd872adbb1f840db
          file media/songs/2026/09/cheap-to-inform/*
      - name: Commit generated release files on the release branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.js data/song-lyrics.js data/briefing.js data/radio-intents.js sitemap.xml updates/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Cheap to Inform catalog, feed and share routes"
            git push origin HEAD:release/cheap-to-inform-20260911
          fi

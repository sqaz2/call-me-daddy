plugins { id 'com.android.application' }
android {
    namespace 'com.musicsubject.player'
    compileSdk 36
    defaultConfig {
        applicationId 'com.musicsubject.player'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('MUSICSUBJECT_KEYSTORE')) {
                storeFile file(System.getenv('MUSICSUBJECT_KEYSTORE'))
                storePassword System.getenv('MUSICSUBJECT_STORE_PASSWORD')
                keyAlias 'musicsubject'
                keyPassword System.getenv('MUSICSUBJECT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
